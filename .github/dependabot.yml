version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates land as one weekly PR; majors stay separate
      # so each can be reviewed and tested on its own.
      npm-minor-and-patch:
        update-types: [minor, patch]
