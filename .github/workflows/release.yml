name: Release

# Pushing a version tag (`v1.2.3`, or a prerelease such as `v1.0.0-beta.1`)
# builds, verifies and publishes droid.or as a *draft* GitHub Release.
# Nothing becomes public until a maintainer reviews and publishes the draft.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One run per tag, never cancelled midway: a half-finished release run could
# leave a draft with only some of its assets attached.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check tag is a SemVer version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$TAG' is not a version tag (expected vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag '$TAG' does not match package.json version '$version'. Bump the version, commit, then tag that commit."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build.yml
