name: Build

# Builds and packages droid.or for all three platforms on every push to
# master. Each OS builds on its own native GitHub-hosted runner, so the
# problems that make cross-building Windows/macOS from this project's own
# (Linux) dev machine impractical don't apply here: better-sqlite3's
# prebuilt native binary for that exact platform is used directly, and
# electron-builder never needs Wine to touch a Windows/macOS artifact it's
# building on that same OS.
#
# No platform has a Developer ID/Authenticode certificate. Windows remains
# unsigned; macOS uses an ad-hoc signature required by Apple Silicon and
# verifies it below. Neither is trusted by Gatekeeper/SmartScreen.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_script: build:linux
            artifact_name: linux-appimage
            artifact_path: release/droid.or-*-x86_64.AppImage
          - os: windows-latest
            build_script: build:win
            artifact_name: windows
            artifact_path: |
              release/*.exe
          - os: macos-latest
            build_script: build:mac
            artifact_name: macos
            artifact_path: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - run: npm run ${{ matrix.build_script }}

      - name: Build unpacked Windows app for native module smoke test
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --dir --publish never

      - name: Verify Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          version=$(node -p 'require("./package.json").version')
          test -f "release/droid.or-${version}-x86_64.AppImage"

      - name: Smoke-test packaged Linux database
        if: matrix.os == 'ubuntu-latest'
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: |
          cd release/linux-unpacked
          ./droid-or -e 'const Database = require(require("path").join(process.resourcesPath, "app.asar/node_modules/better-sqlite3")); const db = new Database(":memory:"); if (db.prepare("SELECT 1 AS ok").get().ok !== 1) process.exit(1); db.close()'

      - name: Verify packaged archive contents
        if: matrix.os == 'ubuntu-latest'
        run: |
          entries="$(npx asar list release/linux-unpacked/resources/app.asar)"
          top_level="$(printf '%s\n' "$entries" | awk -F/ 'NF > 1 { print "/" $2 }' | sort -u)"
          expected_top_level="$(printf '%s\n' /node_modules /out /package.json)"
          if [ "$top_level" != "$expected_top_level" ]; then
            printf 'Unexpected app.asar top-level content:\n%s\n' "$top_level"
            exit 1
          fi
          unexpected="$(printf '%s\n' "$entries" | grep -E '^/out/.*\.map$|(^|/)(test|tests|__tests__)(/|$)|\.(test|spec)\.[^/]+$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected tests or source maps in app.asar:\n%s\n' "$unexpected"
            exit 1
          fi

      - name: Smoke-test packaged Windows database
        if: matrix.os == 'windows-latest'
        env:
          ELECTRON_RUN_AS_NODE: '1'
        shell: pwsh
        run: |
          $executable = "release/win-unpacked/droid-or.exe"
          if (-not (Test-Path $executable)) {
            throw "Missing unpacked Windows app executable: $executable"
          }
          & $executable -e 'const Database = require(require("path").join(process.resourcesPath, "app.asar/node_modules/better-sqlite3")); const db = new Database(":memory:"); if (db.prepare("SELECT 1 AS ok").get().ok !== 1) process.exit(1); db.close()'
          if ($LASTEXITCODE -ne 0) {
            throw "The packaged Windows app could not open a database."
          }

      - name: Verify Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedFiles = @(
            "release/droid.or-$version-x64-portable.exe",
            "release/droid.or-$version-x64-setup.exe"
          )
          $author = node -p "require('./package.json').author.name"
          $expectedCopyright = "Copyright © $((Get-Date).Year) $author"
          foreach ($path in $expectedFiles) {
            if (-not (Test-Path $path)) {
              throw "Missing expected Windows artifact: $path"
            }
            $versionInfo = (Get-Item $path).VersionInfo
            if ($versionInfo.ProductName -ne "droid.or") {
              throw "Unexpected product name in $path`: $($versionInfo.ProductName)"
            }
            if ($versionInfo.ProductVersion -notlike "$version*") {
              throw "Unexpected product version in $path`: $($versionInfo.ProductVersion)"
            }
            if ($versionInfo.LegalCopyright -ne $expectedCopyright) {
              throw "Unexpected copyright in $path`: $($versionInfo.LegalCopyright)"
            }
            if ($versionInfo.CompanyName -ne $author) {
              throw "Unexpected company name in $path`: $($versionInfo.CompanyName)"
            }
            if ($versionInfo.LegalTrademarks -ne "droid.or") {
              throw "Unexpected legal trademarks in $path`: $($versionInfo.LegalTrademarks)"
            }
          }

      - name: Verify macOS ad-hoc signature
        if: matrix.os == 'macos-latest'
        run: |
          app_path="$(find release -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No packaged macOS app found under release/."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=2 "$app_path" 2>&1 | grep -Fx "Signature=adhoc"

      - uses: actions/upload-artifact@v4
        with:
          name: droid-or-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
