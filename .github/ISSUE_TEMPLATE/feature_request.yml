name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        droid.or works without root, using only what ADB and Android's package manager allow on a stock phone. Ideas that need root, or that would pretend to do something Android doesn't allow (for example permanently deleting system apps), are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or situation first, before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine droid.or could support this.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Workarounds you use today, other tools that do this, screenshots.
