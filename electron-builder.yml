appId: dev.droidor.app
productName: droid.or
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/node_modules/**/test/**'
  - '!**/node_modules/**/tests/**'
  - '!**/node_modules/**/__tests__/**'
  - '!**/node_modules/**/*.{test,spec}.*'
publish: null
# A single 1024x1024 source (build/icon.png) — electron-builder derives
# the platform-specific .ico/.icns from it itself for every target below.
# Verified for Linux (the AppImage embeds and displays it correctly); the
# Windows .ico and macOS .icns conversion steps only run on their own
# platform (see the win/mac notes below) so haven't been verified here.
icon: build/icon.png

linux:
  target:
    - target: AppImage
      arch: x64
  artifactName: ${productName}-${version}-x86_64.${ext}
  category: Utility
  # Makes the installed .desktop filename (and Electron's app_id/WM_CLASS)
  # derive from `desktopName` in package.json instead of a generic
  # fallback — otherwise desktop environments can't reliably associate the
  # running window with its own launcher entry/icon.
  syncDesktopName: true

# NSIS itself is bundled with electron-builder and runs natively on Linux —
# but the actual `npm run build:win` from this project's (Linux) dev
# environment fails regardless, for an unrelated reason: better-sqlite3 is
# a native module that needs recompiling against Electron's own ABI for
# each target platform, and node-gyp cannot cross-compile native modules
# for Windows from Linux. This config is correct per electron-builder's own
# docs but has NOT been verified to produce a working artifact — that
# needs an actual Windows machine or CI runner. See DEVELOPMENT.md.
#
# Two targets, both unsigned by design (see DEVELOPMENT.md — a single-file
# build doesn't avoid the SmartScreen/Gatekeeper warning either, only a
# real code-signing certificate does, and this project doesn't have one):
# a proper installer for most users, and a portable single .exe for anyone
# who'd rather not install anything at all. `oneClick: false` on the
# installer is deliberate regardless of signing: a silent one-click install
# is the wrong default for a tool with real ADB capabilities on the
# machine it installs to, matching the rest of this app's
# confirm-before-acting philosophy.
win:
  legalTrademarks: droid.or
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: droid.or
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}

# macOS is arm64-only and distributed as a DMG. `'-'` requests an ad-hoc
# signature, not a Developer ID certificate; CI verifies the packaged app.
mac:
  identity: '-'
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  minimumSystemVersion: '11.0'
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
